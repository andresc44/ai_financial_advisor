[pytest]
testpaths = tests
addopts = -q
# Claude-authored (2026-10-23): the suite (about a minute) twice stopped making progress and sat idle; a test still
# running after 120 s now prints every thread's stack, so the next time shows where it's stuck
faulthandler_timeout = 120
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
